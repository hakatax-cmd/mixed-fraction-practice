<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>帯分数れんしゅう</title>
    <style>
      :root {
        --ink: #16202a;
        --muted: #607080;
        --line: #d9d2c0;
        --blue: #2563eb;
        --green: #14966f;
        --coral: #ef6048;
        --yellow: #ffd166;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 8%, rgba(255, 209, 102, 0.3), transparent 21rem),
          radial-gradient(circle at 90% 16%, rgba(37, 99, 235, 0.13), transparent 20rem),
          linear-gradient(135deg, #fff9ec 0%, #eef7ff 60%, #f3fff8 100%);
        color: var(--ink);
        font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", Arial, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .appShell {
        width: min(980px, calc(100% - 28px));
        margin: 0 auto;
        padding: 24px 0;
      }

      .practiceCard {
        min-height: calc(100vh - 48px);
        border: 2px solid rgba(22, 32, 42, 0.1);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 20px 48px rgba(22, 32, 42, 0.09);
        padding: 24px;
        touch-action: pan-y;
      }

      .practiceCard.swiped {
        animation: swipe-next 180ms ease-out;
      }

      .topBar {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: center;
      }

      .modeSwitch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: min(100%, 360px);
        border: 2px solid var(--line);
        border-radius: 8px;
        background: #fffdf8;
        padding: 4px;
      }

      .modeSwitch button,
      .nextButton,
      .keypad button {
        min-height: 52px;
        border: 0;
        border-radius: 6px;
        font-weight: 900;
      }

      .modeSwitch button {
        background: transparent;
        color: var(--muted);
      }

      .modeSwitch button.active {
        background: var(--blue);
        color: #fff;
      }

      .nextButton {
        background: var(--ink);
        color: #fff;
        padding: 0 18px;
      }

      .problemLine {
        display: flex;
        flex-wrap: wrap;
        gap: clamp(10px, 2.4vw, 26px);
        align-items: center;
        justify-content: center;
        min-height: 220px;
        margin: 28px 0 4px;
        font-size: clamp(3.3rem, 9vw, 7rem);
        font-weight: 900;
        line-height: 1;
      }

      .equals {
        color: var(--muted);
      }

      .fraction,
      .answerFraction {
        display: inline-grid;
        grid-template-rows: auto 5px auto;
        justify-items: center;
        min-width: 0.78em;
        line-height: 0.88;
      }

      .fraction i,
      .answerFraction i {
        display: block;
        width: 100%;
        min-width: 0.74em;
        height: 5px;
        border-radius: 99px;
        background: currentColor;
      }

      .answerFraction {
        gap: 4px;
      }

      .answerBox {
        width: clamp(76px, 13vw, 128px);
        height: clamp(76px, 13vw, 128px);
        border: 4px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: clamp(2.4rem, 7vw, 5rem);
        font-weight: 900;
        line-height: 1;
        text-align: center;
        box-shadow: inset 0 -8px 0 rgba(22, 32, 42, 0.04);
      }

      .answerFraction .answerBox {
        width: clamp(70px, 11vw, 112px);
        height: clamp(58px, 9vw, 88px);
        font-size: clamp(2rem, 5vw, 4rem);
      }

      .answerBox:focus,
      .answerBox.active {
        border-color: var(--blue);
        outline: 5px solid rgba(37, 99, 235, 0.18);
      }

      .feedback {
        min-height: 42px;
        margin: 0 0 12px;
        color: var(--coral);
        font-size: clamp(1.5rem, 4vw, 2.4rem);
        font-weight: 900;
        text-align: center;
      }

      .feedback.good {
        color: var(--green);
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        margin: 0 auto;
        max-width: 720px;
      }

      .keypad button {
        min-height: 68px;
        background: #fff;
        border: 2px solid var(--line);
        color: var(--ink);
        font-size: 1.8rem;
        box-shadow: 0 8px 0 rgba(22, 32, 42, 0.08);
      }

      .keypad button:active {
        transform: translateY(3px);
        box-shadow: 0 5px 0 rgba(22, 32, 42, 0.08);
      }

      .keypad .toolButton {
        background: #edf8ff;
        color: #24507a;
        font-size: 1.2rem;
      }

      .visualReveal {
        display: none;
        margin: 24px auto 0;
        max-width: 820px;
        border-top: 2px dashed var(--line);
        padding-top: 22px;
      }

      .visualReveal.show {
        display: block;
      }

      .mathSentence {
        width: fit-content;
        margin: 0 auto 18px;
        border-radius: 8px;
        background: #eafaf4;
        color: var(--green);
        font-size: clamp(1.3rem, 3vw, 2rem);
        font-weight: 900;
        padding: 12px 16px;
      }

      .groups {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
        gap: 14px;
      }

      .circleGroup {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        aspect-ratio: 1;
        align-content: center;
        justify-content: center;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: #fffdf8;
        padding: 12px;
      }

      .piece {
        aspect-ratio: 1;
        border: 2px solid #c9c1ad;
        border-radius: 50%;
        background: #fff;
      }

      .piece.filled {
        border-color: #ffb13b;
        background: var(--yellow);
      }

      .note {
        margin: 16px 0 0;
        color: var(--muted);
        font-weight: 800;
        text-align: center;
      }

      button:hover {
        filter: brightness(0.97);
      }

      @keyframes swipe-next {
        0% {
          transform: translateX(0);
        }

        45% {
          transform: translateX(-18px);
        }

        100% {
          transform: translateX(0);
        }
      }

      @media (max-width: 720px) {
        .appShell {
          width: min(100% - 18px, 560px);
          padding: 9px 0 18px;
        }

        .practiceCard {
          min-height: calc(100vh - 27px);
          padding: 14px;
        }

        .topBar {
          display: grid;
          grid-template-columns: 1fr;
        }

        .modeSwitch {
          width: 100%;
        }

        .problemLine {
          min-height: 190px;
          margin-top: 18px;
        }

        .keypad {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (max-width: 430px) {
        .problemLine {
          font-size: 3.1rem;
          gap: 9px;
        }

        .answerBox {
          width: 70px;
          height: 70px;
        }

        .answerFraction .answerBox {
          width: 62px;
          height: 52px;
        }

        .keypad button {
          min-height: 58px;
        }
      }
    </style>
  </head>
  <body>
    <main class="appShell">
      <section class="practiceCard" aria-label="帯分数の練習">
        <div class="topBar">
          <div class="modeSwitch" aria-label="問題のレベル">
            <button id="easyButton" class="active" type="button">かんたん</button>
            <button id="hardButton" type="button">むずかしい</button>
          </div>
          <button class="nextButton" id="nextButton" type="button">次の問題</button>
        </div>

        <div class="problemLine">
          <span id="problemFraction"></span>
          <span class="equals">=</span>
          <button id="wholeInput" class="answerBox active" aria-label="整数" data-value="" type="button"></button>
          <span class="answerFraction">
            <button id="restInput" class="answerBox" aria-label="分子" data-value="" type="button"></button>
            <i></i>
            <button id="bottomInput" class="answerBox" aria-label="分母" data-value="" type="button"></button>
          </span>
        </div>

        <div class="feedback" id="feedback" aria-live="polite">&nbsp;</div>

        <div class="keypad" aria-label="数字ボタン">
          <button type="button" data-digit="1">1</button>
          <button type="button" data-digit="2">2</button>
          <button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button>
          <button type="button" data-digit="5">5</button>
          <button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button>
          <button type="button" data-digit="8">8</button>
          <button type="button" data-digit="9">9</button>
          <button type="button" data-digit="0">0</button>
          <button class="toolButton" id="backButton" type="button">消す</button>
          <button class="toolButton" id="clearButton" type="button">やり直し</button>
        </div>

        <section class="visualReveal" id="visualReveal" aria-label="見える形">
          <div class="mathSentence" id="mathSentence"></div>
          <div class="groups" id="groups"></div>
          <p class="note" id="note"></p>
        </section>
      </section>
    </main>

    <script>
      let mode = "easy";
      let problem = createDifferentProblem(mode);
      let activeSlot = "whole";

      const slotOrder = ["whole", "bottom", "rest"];
      const inputs = {
        whole: document.querySelector("#wholeInput"),
        rest: document.querySelector("#restInput"),
        bottom: document.querySelector("#bottomInput"),
      };
      const problemFraction = document.querySelector("#problemFraction");
      const feedback = document.querySelector("#feedback");
      const visualReveal = document.querySelector("#visualReveal");
      const practiceCard = document.querySelector(".practiceCard");
      const mathSentence = document.querySelector("#mathSentence");
      const groups = document.querySelector("#groups");
      const note = document.querySelector("#note");
      const easyButton = document.querySelector("#easyButton");
      const hardButton = document.querySelector("#hardButton");
      let swipeStart = null;

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function createProblem(level) {
        const denominator = level === "easy" ? randomInt(2, 9) : randomInt(2, 11);
        if (level === "hard") {
          let numerator = randomInt(denominator + 1, 100);
          while (numerator % denominator === 0) {
            numerator = randomInt(denominator + 1, 100);
          }
          return { numerator, denominator };
        }

        const maxWhole = 9;
        const whole = randomInt(1, maxWhole);
        const rest = randomInt(1, denominator - 1);
        return { numerator: whole * denominator + rest, denominator };
      }

      function problemKey(item) {
        return `${item.numerator}/${item.denominator}`;
      }

      function createDifferentProblem(level) {
        let previous = "";
        try {
          previous = sessionStorage.getItem("lastMixedFractionProblem") || "";
        } catch {
          previous = "";
        }

        let next = createProblem(level);
        for (let attempt = 0; attempt < 20 && problemKey(next) === previous; attempt += 1) {
          next = createProblem(level);
        }

        try {
          sessionStorage.setItem("lastMixedFractionProblem", problemKey(next));
        } catch {
        }

        return next;
      }

      function solve() {
        return {
          whole: Math.floor(problem.numerator / problem.denominator),
          rest: problem.numerator % problem.denominator,
        };
      }

      function expected(slot) {
        const result = solve();
        return {
          whole: String(result.whole),
          rest: String(result.rest),
          bottom: String(problem.denominator),
        }[slot];
      }

      function fraction(top, bottom) {
        return `<span class="fraction" aria-label="${bottom}ぶんの${top}"><span>${top}</span><i></i><span>${bottom}</span></span>`;
      }

      function setActive(slot) {
        activeSlot = slot;
        Object.entries(inputs).forEach(([key, input]) => {
          input.classList.toggle("active", key === slot);
          input.blur();
        });
      }

      function nextSlot(slot) {
        const index = slotOrder.indexOf(slot);
        if (index < slotOrder.length - 1) setActive(slotOrder[index + 1]);
      }

      function setSlotValue(slot, rawValue) {
        const value = rawValue.replace(/\D/g, "").slice(0, expected(slot).length);
        setAnswerValue(slot, value);
        if (value.length >= expected(slot).length) nextSlot(slot);
        checkState();
      }

      function getAnswerValue(slot) {
        return inputs[slot].dataset.value || "";
      }

      function setAnswerValue(slot, value) {
        inputs[slot].dataset.value = value;
        inputs[slot].textContent = value;
      }

      function checkState() {
        const complete = slotOrder.every((slot) => getAnswerValue(slot).length > 0);
        const correct = slotOrder.every((slot) => getAnswerValue(slot) === expected(slot));
        if (!complete) {
          feedback.innerHTML = "&nbsp;";
          visualReveal.classList.remove("show");
          return;
        }
        feedback.textContent = correct ? "正解" : "もう一度";
        feedback.className = correct ? "feedback good" : "feedback";
        visualReveal.classList.toggle("show", correct);
        if (correct) showVisual();
      }

      function showVisual() {
        const result = solve();
        mathSentence.textContent = `${problem.numerator} ÷ ${problem.denominator} = ${result.whole} あまり ${result.rest}`;
        groups.innerHTML = "";
        for (let i = 0; i < Math.min(result.whole, 10); i += 1) {
          groups.appendChild(circleGroup(problem.denominator, problem.denominator, `${i + 1}こめの1`));
        }
        groups.appendChild(circleGroup(result.rest, problem.denominator, `あまり${result.rest}`));
        note.textContent = result.whole > 10 ? "まるが多いので、はじめの10こまで表示中" : "";
      }

      function circleGroup(filled, total, label) {
        const group = document.createElement("div");
        group.className = "circleGroup";
        group.setAttribute("aria-label", label);
        for (let index = 0; index < total; index += 1) {
          const piece = document.createElement("span");
          piece.className = index < filled ? "piece filled" : "piece";
          group.appendChild(piece);
        }
        return group;
      }

      function resetInputs() {
        slotOrder.forEach((slot) => {
          setAnswerValue(slot, "");
        });
        feedback.innerHTML = "&nbsp;";
        visualReveal.classList.remove("show");
        setActive("whole");
      }

      function resetInputsAfterBrowserRestore() {
        resetInputs();
        requestAnimationFrame(resetInputs);
        setTimeout(resetInputs, 80);
        setTimeout(resetInputs, 240);
      }

      function nextProblem() {
        problem = createDifferentProblem(mode);
        renderProblem();
        resetInputsAfterBrowserRestore();
      }

      function isInteractiveTarget(target) {
        return Boolean(target.closest("button, input"));
      }

      function startSwipe(event) {
        if (event.pointerType !== "touch" || isInteractiveTarget(event.target)) return;
        swipeStart = { x: event.clientX, y: event.clientY };
      }

      function finishSwipe(event) {
        if (!swipeStart || event.pointerType !== "touch") return;
        const deltaX = event.clientX - swipeStart.x;
        const deltaY = event.clientY - swipeStart.y;
        swipeStart = null;
        if (deltaX > -72 || Math.abs(deltaY) > 52) return;

        practiceCard.classList.add("swiped");
        window.setTimeout(() => practiceCard.classList.remove("swiped"), 180);
        nextProblem();
      }

      function startTouchSwipe(event) {
        if (isInteractiveTarget(event.target) || event.touches.length !== 1) return;
        const touch = event.touches[0];
        swipeStart = { x: touch.clientX, y: touch.clientY };
      }

      function finishTouchSwipe(event) {
        if (!swipeStart || event.changedTouches.length !== 1) return;
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - swipeStart.x;
        const deltaY = touch.clientY - swipeStart.y;
        swipeStart = null;
        if (deltaX > -72 || Math.abs(deltaY) > 52) return;

        practiceCard.classList.add("swiped");
        window.setTimeout(() => practiceCard.classList.remove("swiped"), 180);
        nextProblem();
      }

      function renderProblem() {
        problemFraction.innerHTML = fraction(problem.numerator, problem.denominator);
      }

      Object.entries(inputs).forEach(([slot, input]) => {
        input.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          setActive(slot);
        });
        input.addEventListener("click", () => setActive(slot));
      });

      document.addEventListener("keydown", (event) => {
        if (/^\d$/.test(event.key)) {
          event.preventDefault();
          setSlotValue(activeSlot, getAnswerValue(activeSlot) + event.key);
          return;
        }

        if (event.key === "Backspace" || event.key === "Delete") {
          event.preventDefault();
          document.querySelector("#backButton").click();
        }
      });

      document.querySelectorAll("[data-digit]").forEach((button) => {
        button.addEventListener("click", () => {
          setSlotValue(activeSlot, getAnswerValue(activeSlot) + button.dataset.digit);
        });
      });

      document.querySelector("#backButton").addEventListener("click", () => {
        const current = getAnswerValue(activeSlot);
        if (current.length > 0) {
          setAnswerValue(activeSlot, current.slice(0, -1));
          checkState();
          return;
        }
        const index = slotOrder.indexOf(activeSlot);
        if (index > 0) setActive(slotOrder[index - 1]);
      });

      document.querySelector("#clearButton").addEventListener("click", resetInputs);
      document.querySelector("#nextButton").addEventListener("click", nextProblem);
      practiceCard.addEventListener("pointerdown", startSwipe);
      practiceCard.addEventListener("pointerup", finishSwipe);
      practiceCard.addEventListener("pointercancel", () => {
        swipeStart = null;
      });
      practiceCard.addEventListener("touchstart", startTouchSwipe, { passive: true });
      practiceCard.addEventListener("touchend", finishTouchSwipe, { passive: true });
      practiceCard.addEventListener("touchcancel", () => {
        swipeStart = null;
      });
      easyButton.addEventListener("click", () => {
        mode = "easy";
        easyButton.classList.add("active");
        hardButton.classList.remove("active");
        nextProblem();
      });
      hardButton.addEventListener("click", () => {
        mode = "hard";
        hardButton.classList.add("active");
        easyButton.classList.remove("active");
        nextProblem();
      });

      renderProblem();
      resetInputsAfterBrowserRestore();
      window.addEventListener("pageshow", resetInputsAfterBrowserRestore);
    </script>
  </body>
</html>
